[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-os-api"
version = "0.1.0"
description = "Standalone business-data API for Autonomous Business OS"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn[standard]==0.48.0",
  "SQLAlchemy==2.0.50",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]==2.13.0",
  "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
