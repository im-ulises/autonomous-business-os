name: Backend API
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - "feat/standalone-fastapi-backend"
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: autonomous_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d autonomous_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/autonomous_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q app
      - run: pytest -q
      - name: Verify Cloudflare Worker syntax and config
        run: |
          node --check cloudflare/index.js
          python - <<'PY'
          import json
          from pathlib import Path
          for path in ("wrangler.staging.jsonc", "wrangler.production.jsonc"):
              data = json.loads(Path(path).read_text())
              assert data["main"] == "cloudflare/index.js"
              assert data["containers"][0]["scheduling_policy"] == "durable_object"
              assert data["containers"][0]["images"]["base"]["dockerfile"] == "./Dockerfile"
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dry run Cloudflare staging Worker
        run: npx --yes wrangler@4.164.0 deploy --dry-run --config wrangler.staging.jsonc
