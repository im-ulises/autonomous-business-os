name: Frontend contract validation
on:
  pull_request:
    paths:
      - "lib/api-client.ts"
      - "lib/types.ts"
      - "app/**"
      - ".github/workflows/frontend-contract-ci.yml"
  push:
    branches:
      - "feat/frontend-backend-contract-v1"
    paths:
      - "lib/api-client.ts"
      - "lib/types.ts"
      - ".github/workflows/frontend-contract-ci.yml"
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
