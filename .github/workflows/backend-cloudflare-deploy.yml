name: Deploy Autonomous OS Backend to Cloudflare
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy isolated staging or production Worker"
        required: true
        default: staging
        type: choice
        options: [staging, production]
permissions:
  contents: read

concurrency:
  group: autonomous-backend-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.AUTONOMOUS_DATABASE_URL }}
      JWT_ISSUER: ${{ secrets.AUTONOMOUS_JWT_ISSUER }}
      JWT_AUDIENCE: ${{ secrets.AUTONOMOUS_JWT_AUDIENCE }}
      JWT_JWKS_URL: ${{ secrets.AUTONOMOUS_JWT_JWKS_URL }}
      CORS_ORIGINS: ${{ vars.AUTONOMOUS_CORS_ORIGINS }}
      CONFIG: wrangler.${{ inputs.environment }}.jsonc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require secrets before deployment
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL JWT_ISSUER JWT_AUDIENCE JWT_JWKS_URL; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required secret $key"
              exit 1
            fi
          done
      - name: Deploy Cloudflare Worker and FastAPI Container
        run: npx --yes wrangler@4.164.0 deploy --config "$CONFIG"
      - name: Set Worker secrets
        shell: bash
        run: |
          set -euo pipefail
          for key in DATABASE_URL JWT_ISSUER JWT_AUDIENCE JWT_JWKS_URL CORS_ORIGINS; do
            printf '%s' "${!key:-}" | npx --yes wrangler@4.164.0 secret put "$key" --config "$CONFIG"
          done
      - name: List deployment status
        run: npx --yes wrangler@4.164.0 deployments list --config "$CONFIG"
